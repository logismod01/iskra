name: Sye — сборка для Windows

# Собирает установщик агента Sye на серверах GitHub, чтобы не держать
# Electron на своём компьютере. Готовые файлы лежат в разделе Actions → Artifacts.
on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверки Sye
        working-directory: agent
        run: npm test

  windows:
    name: Установщик .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Зависимости
        working-directory: agent
        run: npm ci --no-audit --no-fund
      - name: Сборка nsis + portable
        working-directory: agent
        run: npx electron-builder --win nsis portable --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache
      - name: Список файлов
        working-directory: agent
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Sye-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            agent/dist/*.exe
            agent/dist/*.blockmap
            agent/dist/*.yml

  linux-smoke:
    name: Запуск на Linux (проверка окна)
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Зависимости
        working-directory: agent
        run: npm ci --no-audit --no-fund
      - name: Окно открывается без ошибок
        working-directory: agent
        run: xvfb-run --auto-servernum npx electron . --no-sandbox --smoke-test

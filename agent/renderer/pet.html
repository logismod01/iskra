<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Сью</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <!-- Окно прозрачное: на рабочем столе виден только сам Сью и облачко с фразой. -->

    <div class="bubble" id="bubble" hidden></div>
    <div class="stage">
      <div class="figure" id="figure">
        <svg class="sye-mascot" viewBox="0 0 64 64" role="img" aria-label="Сью">

          <circle class="sye-eye" cx="25.4" cy="31.4" r="2.5"/>
          <circle class="sye-eye" cx="38.6" cy="31.4" r="2.5"/>
          <circle class="sye-cheek" cx="20.2" cy="37.4" r="2.3"/>
          <circle class="sye-cheek" cx="43.8" cy="37.4" r="2.3"/>
          <path class="sye-mouth" d="M28.2 38.6c1.3 1.7 6.3 1.7 7.6 0"/>
        </svg>
      </div>
      <div class="shadow"></div>
    </div>
  </div>
  <script src="pet.js"></script>
